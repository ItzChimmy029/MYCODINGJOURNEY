<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORM</title>
</head>
<body>
    <form action="">
        <label for="name">Name:</label>
        <input type="text" id="name" placeholder="input your name" required>
        <br><br><br>
        <label for="gender">Select your gender</label>
        <input type="radio" name="gender" id="male" value="male">
        <label for="male">Male</label>
        <input type="radio" name="gender" id="female" value="female">
        <label for="female">Female</label>
        <br><br><br>
        <label for="email">Email : </label>
        <input type="email" name="email" id="email" placeholder="input your email" required>
        <br><br><br>
        <label for="phone">Phone : </label>
        <input type="tel" name="phone" id="phone" placeholder="input your phone number" required>
        <br><br><br>
        <label for="dob">Date of Birth : </label>
        <input type="date" name="dob" id="dob">
        <br><br><br>
        <label for="password">Password : </label>
        <input type="password" name="password" id="password" placeholder="input your password" required>
        <br><br><br>
        <label for="confirm-password">Confirm Password : </label>
        <input type="password" name="confirm-password" id="confirm-password" placeholder="confirm your password" required>
        <br><br><br>
        <input type="file" name="profile-picture" id="profile-picture">
        <br><br><br>
        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
    </form>
</body>
</html>
