<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anchor Tags for Kids</title>
</head>
<body>
    <!-- An anchor tag is like a door. When you click it, you go to a different place, just like opening a door leads you to another room(page) or even another house(website). -->
     <a href="https://www.google.com">Visit Google</a>
    <p>Click the link above to go to Google!</p>
    <!-- <a> = the "anchor" tag -->
        <!-- href = "...." = the address(where the door leads to) -->
         <!-- Visit Google = the text that will be displayed-->
</body>
</html>
