<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMI Calculator</title>
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #11998e, #38ef7d);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .card {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 30px;
      width: 90%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(12px);
    }

    .card h1 {
      font-size: 26px;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 10px;
      border: none;
      font-size: 16px;
      text-align: center;
    }

    button {
      background: linear-gradient(90deg, #ff416c, #ff4b2b);
      border: none;
      border-radius: 12px;
      padding: 12px 22px;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin: 8px;
      transition: transform 0.25s ease, background 0.3s ease;
    }

    button:hover {
      transform: scale(1.08);
      background: linear-gradient(90deg, #ff4b2b, #ff416c);
    }

    .result {
      margin-top: 15px;
      font-weight: bold;
      text-align: center;
      font-size: 20px;
      animation: fadeIn 0.5s ease;
    }

    .scale-icon {
      font-size: 60px;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>⚖️ BMI Calculator</h1>
    <div class="scale-icon">⚖️</div>
    <label for="weight">Weight (kg)</label>
    <input type="number" id="weight" placeholder="Enter weight" />

    <label for="height">Height (cm)</label>
    <input type="number" id="height" placeholder="Enter height" />

    <div>
      <button onclick="calculateBMI()">Calculate BMI</button>
      <button onclick="clearBMI()">Clear</button>
    </div>

    <p class="result" id="bmi-result"></p>
  </div>

  <script>
    function calculateBMI() {
      let weight = document.getElementById("weight").value;
      let height = document.getElementById("height").value;
      let result = document.getElementById("bmi-result");

      if (weight === "" || height === "") {
        result.textContent = "⚠️ Please enter both weight and height.";
        return;
      }

      let heightInM = height / 100;
      let bmi = (weight / (heightInM * heightInM)).toFixed(2);

      let status = "";
      if (bmi < 18.5) status = "Underweight";
      else if (bmi < 25) status = "Normal";
      else if (bmi < 30) status = "Overweight";
      else status = "Obese";

      result.textContent = `Your BMI is ${bmi} (${status})`;
    }

    function clearBMI() {
      document.getElementById("weight").value = "";
      document.getElementById("height").value = "";
      document.getElementById("bmi-result").textContent = "";
    }
  </script>
</body>
</html>
