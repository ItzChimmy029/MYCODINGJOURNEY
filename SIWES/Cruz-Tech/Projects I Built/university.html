<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>University Top Bar</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
  <div class="top-header text-white py-2 d-none d-lg-block" style="background-color: #0047AB;">
    <div class="container-fluid">
        <div class="row align-items-center">
            <div class="col-lg-6 d-flex align-items-center justify-content-start">
                <div class="d-flex align-items-center me-4">
                    <i class="fas fa-phone me-2"></i>
                    <span class="text-nowrap">+234802458394, +23494374304, +2347094633474</span>
                </div>
                <div class="d-flex align-items-center">
                    <i class="fas fa-envelope me-2"></i>
                    <span class="text-nowrap">myuniversity@info.org</span>
                </div>
            </div>
            <div class="col-lg-6 d-flex justify-content-end">
                <ul class="list-unstyled d-flex mb-0">
                    <li class="me-3"><a href="#" class="text-white text-decoration-none text-nowrap">PG Program</a></li>
                    <li class="me-3"><a href="#" class="text-white text-decoration-none text-nowrap">Alumni</a></li>
                    <li class="me-3"><a href="#" class="text-white text-decoration-none text-nowrap">Journals</a></li>
                    <li class="me-3"><a href="#" class="text-white text-decoration-none text-nowrap">My Learning Space</a></li>
                    <li class="me-3"><a href="#" class="text-white text-decoration-none text-nowrap">News & Events</a></li>
                    <li class="me-3"><a href="#" class="text-white text-decoration-none text-nowrap">FAQs</a></li>
                    <li class="me-3"><a href="#" class="text-white text-decoration-none text-nowrap">Student Support Services</a></li>
                    <li><a href="#" class="text-white text-decoration-none text-nowrap">Contact Us</a></li>
                </ul>
            </div>
        </div>
    </div>
</div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
