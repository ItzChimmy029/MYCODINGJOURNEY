<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bible App</title>
    <link rel="stylesheet" href="bible.css">
</head>
<body>
    <header>
        <h1>Bible App</h1>
        <p>Select a book, chapter, and verse to explore the Bible</p>
    </header>
    
    <section id="bible-app">
        <div class="container">
            <div class="book-list">
                <h2>Books</h2>
                <ul id="books"></ul>
            </div>
            <div class="chapter-list">
                <h2>Chapters</h2>
                <ul id="chapters"></ul>
            </div>
            <div class="verse-list">
                <h2>Verses</h2>
                <ul id="verses"></ul>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2024 Bible App</p>
    </footer>

    <script src="bible.js"></script>
</body>
</html>
