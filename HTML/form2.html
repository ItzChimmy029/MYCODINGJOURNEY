<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Git Hub Sign In</title>
    <style>
        body{
            font-family: Arial,sans-serif;
            background-color: #f6f8fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 80vh;
            margin: 0;
        }
        .container{
            width: 300px;
            background-color: #f6f8fa;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .container img {
            width: 50px;
        }
        .container h2{
            font-size: 20px;
            margin-bottom: 20px;
        }
        .container input{
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
        }
        .container button{
            width: 100%;
            padding: 10px;
            background-color: #2ea44f;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }
        .container a{
            display: block;
            margin: 10px 0;
            color: #0366d6;
            text-decoration: none;
        }
        <!-- span{
            display: flex;
            flex-direction: column-reverse;
        
        } -->
    </style>
</head>
<body>
    <div class="container">
        <img src="image/github/download.png" alt="GitHub Logo">
        <h2>Sign In to GitHub</h2>
        <input type="text" placeholder="Username or Password">
        <p>
        <input type="password" placeholder="Password">
    </p>
        <button>Sign In</button>
       <p> <a href="#">Forgot Password</a>
        </p>
       <p> <a href="#">Sign In with a passkey</a>
       </p>
       <p> <a href="#">New to GitHub ? Create an account</a>
       </p>
    </div>
    <span>
        <p>
        <a href="#">Terms</a>
        <a href="#">Privacy</a>
        <a href="#">Docs</a>
        <a href="#">Contact GitHub</a>
        <a href="#">Support</a>
    </p>
        </span>
    
</body>
</html>
