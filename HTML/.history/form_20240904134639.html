<!DOCTYPE html
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Sign In</title>
    <style>
        * {
            margin: 5px;
            padding: 5px;
            box-sizing: border-box;
        }
        
        body {
            background-color: #f6f8fa;
            color: #333;
            font-family: Arial, sans-serif;
            font-size: 16px;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        
        .img {
            background-color: aliceblue;
        }
        
        fieldset {
            border: none;
            padding: 20px;
            border-radius: 5px;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        
        legend {
            font-weight: bold;
            text-align: left;
            margin-bottom: 10px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
        }
        
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
        }
        
        input[type="submit"] {
            width: 100%;
            padding: 10px;
            background-color: #2ea44f;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        a {
            color: blue;
            text-decoration: none;
        }
        
        a:hover {
            text-emphasis-color: aqua;
            font-size: 12px;
        }
        
        p {
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="container">
        <img src="image/github/download.png" width="100" height="100" alt="GitHub Logo">
        <h1>Sign In to GitHub</h1>
        <fieldset>
            <legend></legend>
            <form action="">
                <label for="username">Username or Email:</label>
                <input type="text" id="username" name="login" required placeholder="Input your username or email">
                <p>
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required placeholder="Input your password">
                </p>
                <input type="submit" value="Sign In">
            </form>
        </fieldset>
        <p>Forgot your password? <a href="">Click here to reset it.</a></p>
        <p>Don't have an account? <a href="">Sign up</a></p>
    </div>
</body>

</html>
