<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account</title>
    <link rel="stylesheet" href="Figmaform.css" />
  </head>
  <body>
    <div class="container">
      <div class="form-box">
        <h2>Create An Account</h2>
        <form id="createAccountForm">
          <div class="input-box">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" name="fullName" required />
          </div>
          <div class="input-box">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required />
          </div>
          <div class="input-box">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" required />
          </div>
          <div class="input-box">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required />
            <!-- <img
              src="image/hiddenpassword.png"
              alt="Toggle"
              class="toggle-password"
            /> -->
          </div>
          <div class="input-box">
            <label for="confirmPassword">Confirm Password</label>
            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              required
            />
            <!-- <img
              src="image/hiddenpassword.png"
              alt="Toggle"
              class="toggle-password"
            /> -->
          </div>
          <div>
            <button type="submit" class="Normal">Register</button>
            <button class="googleButton" type="submit">Register with Google 
                <img src="image/google.png" alt="google Image" height="20px" width="20px" class="google"/>
            </button>
          </div>
          <p>Already have an account ?
            <a href="#" target="_blank">Login</a>
          </p>
        </form>
      </div>
    </div>
    <script src="Figmaform.js"></script>
  </body>
</html>
